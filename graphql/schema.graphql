


type Role {
  id: ID!
  name: String
  created_at: String
  updated_at: String
}
type Query {
  roles: [Role!]! @all
  role(id: ID! @eq): Role @find
}
type User {
  id: ID!
  name: String
  email: String
  created_at: String
  updated_at: String
}
type Query {
  users: [User!]! @all
  user(id: ID! @eq): User @find
}
